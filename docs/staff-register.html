<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ลงทะเบียนให้ผู้เข้างาน</title>
  <meta name="theme-color" content="#74065f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ลงทะเบียน กฟภ.">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand"><span class="logo"><img src="img/pea-logo.png" alt="PEA การไฟฟ้าส่วนภูมิภาค" width="120" height="44"></span><div class="brand-text"><small id="orgName">การไฟฟ้าส่วนภูมิภาค</small><span id="eventName" data-fixed="1">ลงทะเบียนให้ผู้เข้างาน</span></div></div>
      <span class="who" id="who"></span>
      <a class="link" href="checkin.html">เช็คอิน</a>
      <a class="link" href="index.html">แดชบอร์ด</a>
      <a class="link" href="staff-register.html" aria-current="page">ลงทะเบียน</a>
      <a class="link" href="manual.pdf" download="คู่มือการใช้งาน.pdf">คู่มือ (PDF)</a>
    </div>
  </header>

  <main class="wrap reg-wrap">
    <div id="notice" class="notice" hidden></div>

    <section id="formView" hidden>
      <div class="card reg-card">
        <h1>ลงทะเบียนให้ผู้เข้างาน</h1>
        <p class="muted">สำหรับเจ้าหน้าที่ลงทะเบียนแทนผู้เข้างาน บังคับกรอกเฉพาะชื่อและเบอร์โทรศัพท์</p>

        <div class="step-label">1. เลือกบริษัท</div>
        <div id="pickBox">
          <label class="search" id="searchBox">
            <span class="sr-only">ค้นหาบริษัท</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="พิมพ์ชื่อบริษัท หรือ PEA No." autocomplete="off">
            <button class="clear" type="button" aria-label="ล้างคำค้นหา">✕</button>
          </label>
          <div id="results" class="results" role="listbox" aria-label="ผลการค้นหาบริษัท"></div>
          <button class="btn btn-block offlist-link" type="button" id="useOfflist"><span class="plus" aria-hidden="true">+</span><span class="ol-txt">ไม่พบบริษัทในรายชื่อ<small>กดที่นี่เพื่อกรอกชื่อบริษัทเอง</small></span></button>
        </div>
        <div id="offlistBox" hidden>
          <div class="field">
            <label for="fCompany">ชื่อบริษัท / หน่วยงาน *</label>
            <input id="fCompany" maxlength="150" autocomplete="off" placeholder="เช่น บริษัท ตัวอย่าง จำกัด">
          </div>
          <button class="btn btn-ghost btn-sm" type="button" id="backToList">← กลับไปค้นหาจากรายชื่อ</button>
        </div>
        <div id="picked" class="picked" hidden>
          <div>
            <div class="picked-name" id="pickedName"></div>
            <div class="muted" id="pickedId"></div>
          </div>
          <button class="btn btn-ghost" type="button" id="changeCompany">เปลี่ยน</button>
        </div>

        <form id="regForm" novalidate>
          <div class="step-label">2. ข้อมูลผู้เข้างาน</div>
          <div class="field">
            <label for="fName">ชื่อ-นามสกุล *</label>
            <input id="fName" maxlength="100" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="fPhone">เบอร์โทรศัพท์ *</label>
            <input id="fPhone" type="tel" inputmode="numeric" maxlength="15" autocomplete="off" placeholder="08xxxxxxxx" required>
          </div>
          <div class="field">
            <label for="fPosition">ตำแหน่ง</label>
            <input id="fPosition" maxlength="100" autocomplete="off">
          </div>
          <div class="field">
            <label for="fEmail">อีเมล</label>
            <input id="fEmail" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="120">
          </div>
          <p class="error-text" id="formError" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit" id="submitBtn">✔ ลงทะเบียน</button>
        </form>
      </div>
    </section>

    <section id="doneView" class="card reg-card done" hidden>
      <div class="done-icon" aria-hidden="true">✔</div>
      <h1>ลงทะเบียนสำเร็จ</h1>
      <dl class="done-info">
        <dt>ชื่อ</dt><dd id="dName"></dd>
        <dt>บริษัท</dt><dd id="dCompany"></dd>
        <dt>เวลา</dt><dd id="dTime"></dd>
      </dl>
      <button class="btn btn-primary btn-block" type="button" id="sameCompany">ลงทะเบียนคนต่อไป (บริษัทเดิม)</button>
      <button class="btn btn-ghost btn-block" type="button" id="newCompany" style="margin-top:8px">เปลี่ยนบริษัท</button>
    </section>
  </main>

  <script src="js/config.js?v=14"></script>
  <script src="js/common.js?v=14"></script>
  <script>
    (function () {
      const { session, escapeHtml, matches, fmtClock, toast } = window.App;
      const $ = (id) => document.getElementById(id);
      const MAX_RESULTS = 30;
      const state = { companies: [], picked: null, offlist: false };
      const s = session.get();

      function fail(msg, toLogin) {
        ['formView', 'doneView'].forEach((id) => { $(id).hidden = true; });
        $('notice').hidden = false;
        $('notice').innerHTML = escapeHtml(msg) + (toLogin ? ' — <a href="checkin.html">เข้าสู่ระบบ</a>' : '');
      }
      if (!s || !s.token) { fail('กรุณาเข้าสู่ระบบเจ้าหน้าที่ก่อน', true); return; }
      $('who').textContent = '👤 ' + s.user.name;

      function show(view) {
        $('formView').hidden = view !== 'formView';
        $('doneView').hidden = view !== 'doneView';
        window.scrollTo(0, 0);
      }
      function formError(msg, el) { $('formError').textContent = msg; if (el) el.focus(); }

      /* ---------- เลือกบริษัท ---------- */
      const q = $('q');
      function renderResults() {
        const query = q.value.trim();
        $('searchBox').classList.toggle('has-text', !!query);
        if (!query) { $('results').innerHTML = ''; return; }
        const found = state.companies.filter((c) => matches(c, query));
        if (!found.length) {
          $('results').innerHTML = `<div class="empty">ไม่พบบริษัท "${escapeHtml(query)}" ในรายชื่อ<br>กดปุ่มด้านล่างเพื่อกรอกชื่อบริษัทเอง</div>`;
          return;
        }
        $('results').innerHTML = found.slice(0, MAX_RESULTS).map((c) => `
          <button type="button" class="result" role="option" data-id="${escapeHtml(c.id)}">
            <span class="result-name">${escapeHtml(c.name)}</span>
            <span class="tag">${escapeHtml(c.id)}</span>
          </button>`).join('')
          + (found.length > MAX_RESULTS ? `<div class="empty">พบ ${found.length} รายการ พิมพ์เพิ่มเพื่อให้แคบลง</div>` : '');
      }
      q.addEventListener('input', renderResults);
      $('searchBox').querySelector('.clear').addEventListener('click', () => { q.value = ''; renderResults(); q.focus(); });

      function pick(c) {
        if (!c) return;
        state.picked = c;
        $('pickedName').textContent = c.name;
        $('pickedId').textContent = 'PEA No. ' + c.id;
        $('pickBox').hidden = true;
        $('picked').hidden = false;
        $('formError').textContent = '';
        $('fName').focus();
      }
      $('results').addEventListener('click', (e) => {
        const b = e.target.closest('[data-id]');
        if (b) pick(state.companies.find((c) => c.id === b.dataset.id));
      });
      function resetCompany() {
        state.picked = null;
        state.offlist = false;
        $('picked').hidden = true;
        $('offlistBox').hidden = true;
        $('pickBox').hidden = false;
        q.value = '';
        renderResults();
      }
      $('changeCompany').addEventListener('click', () => { resetCompany(); q.focus(); });

      $('useOfflist').addEventListener('click', () => {
        state.offlist = true;
        state.picked = null;
        $('pickBox').hidden = true;
        $('offlistBox').hidden = false;
        if (!$('fCompany').value && /\D/.test(q.value)) $('fCompany').value = q.value.trim();
        $('formError').textContent = '';
        $('fCompany').focus();
      });
      $('backToList').addEventListener('click', () => { resetCompany(); q.focus(); });

      /* ---------- ส่งข้อมูล ---------- */
      const dateFmt = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Bangkok' });
      function showDone(r) {
        $('dName').textContent = r.name;
        $('dCompany').textContent = String(r.id).indexOf('X-') === 0 ? `${r.company} (นอกรายชื่อ)` : `${r.company} (${r.id})`;
        $('dTime').textContent = `${dateFmt.format(new Date(r.time))} ${fmtClock(new Date(r.time))} น.`;
        show('doneView');
      }

      $('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = $('fName').value.trim();
        const phone = App.validate.phone($('fPhone').value);
        const email = $('fEmail').value.trim();
        const companyName = $('fCompany').value.trim();
        if (state.offlist && companyName.length < 2) return formError('กรุณากรอกชื่อบริษัท / หน่วยงาน', $('fCompany'));
        if (!state.offlist && !state.picked) return formError('กรุณาเลือกบริษัท หรือกด "กรอกชื่อบริษัทเอง"', q);
        if (name.length < 2) return formError('กรุณากรอกชื่อ-นามสกุล', $('fName'));
        if (!phone) return formError(App.validate.PHONE_MSG, $('fPhone'));
        if (email && !App.validate.email(email)) return formError(App.validate.EMAIL_MSG, $('fEmail'));

        const btn = $('submitBtn');
        btn.disabled = true;
        btn.textContent = 'กำลังบันทึก…';
        $('formError').textContent = '';
        try {
          const company = state.offlist ? { offlist: true, companyName } : { id: state.picked.id };
          const r = await App.postRetry('staffRegister',
            Object.assign({ token: s.token, name, phone, email, position: $('fPosition').value.trim() }, company),
            () => { btn.textContent = 'มีผู้ลงทะเบียนจำนวนมาก กำลังลองใหม่…'; });
          showDone(r);
        } catch (err) {
          if (err.code === 'SESSION_EXPIRED') { session.clear(); fail(err.message, true); return; }
          formError(err.code === 'NETWORK' ? 'ส่งข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วกดลงทะเบียนอีกครั้ง' : err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = '✔ ลงทะเบียน';
        }
      });

      $('sameCompany').addEventListener('click', () => { // เก็บบริษัทเดิม ล้างเฉพาะข้อมูลบุคคล
        $('regForm').reset();
        $('formError').textContent = '';
        show('formView');
        $('fName').focus();
      });
      $('newCompany').addEventListener('click', () => {
        $('fCompany').value = '';
        $('regForm').reset();
        $('formError').textContent = '';
        resetCompany();
        show('formView');
        q.focus();
      });

      /* ---------- เริ่มต้น ---------- */
      show('formView');
      const snap = App.list.snapshot();
      if (snap) state.companies = snap.companies;
      App.list.refresh()
        .then(() => { state.companies = App.list.current.companies; renderResults(); })
        .catch(() => { if (!state.companies.length) toast('โหลดรายชื่อบริษัทไม่สำเร็จ กรุณารีเฟรชหน้า', 'error'); });
    })();
  </script>
</body>
</html>
